services:
  volume-init:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "-c", "chown -R 10001:10001 /data/media /data/static"]
    volumes:
      - media:/data/media
      - static:/data/static
    network_mode: none

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pysoy}
      POSTGRES_USER: ${POSTGRES_USER:-pysoy}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  web:
    image: ${PYSOY_WEB_IMAGE:?set PYSOY_WEB_IMAGE}
    restart: unless-stopped
    environment:
      PYSOY_DEBUG: "0"
      PYSOY_SECRET_KEY_FILE: /run/secrets/django_secret_key
      PYSOY_ALLOWED_HOSTS: ${PYSOY_SITE_HOST:?set PYSOY_SITE_HOST},127.0.0.1,localhost
      PYSOY_CSRF_TRUSTED_ORIGINS: https://${PYSOY_SITE_HOST:?set PYSOY_SITE_HOST}
      PYSOY_TRUST_PROXY: "1"
      PYSOY_DB_NAME: ${POSTGRES_DB:-pysoy}
      PYSOY_DB_USER: ${POSTGRES_USER:-pysoy}
      PYSOY_DB_PASSWORD_FILE: /run/secrets/postgres_password
      PYSOY_DB_HOST: db
      PYSOY_DB_PORT: "5432"
      PYSOY_MEDIA_ROOT: /app/var/media
      PYSOY_STATIC_ROOT: /app/var/static
    secrets:
      - django_secret_key
      - postgres_password
    volumes:
      - media:/app/var/media
      - static:/app/var/static
    networks:
      - edge
      - data
    depends_on:
      volume-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_health/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PYSOY_SITE_HOST: ${PYSOY_SITE_HOST:?set PYSOY_SITE_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

secrets:
  django_secret_key:
    file: ./secrets/django_secret_key
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  postgres:
  media:
    name: ${PYSOY_MEDIA_VOLUME:-pysoy_media}
  static:
    name: ${PYSOY_STATIC_VOLUME:-pysoy_static}
  caddy_data:
  caddy_config:

networks:
  edge:
  data:
    internal: true
